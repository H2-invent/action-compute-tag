name: "Compute container tag"
description: "Berechnet den Container-Image-Tag je nach PR-Event, Ziel- und Source-Branch."

inputs:
  event-name:
    description: "pull_request oder workflow_dispatch"
    required: true
  base-ref:
    description: "Ziel-Branch des PRs bzw. der manuell gewählte Branch"
    required: true
  head-ref:
    description: "Source-Branch des PRs (nur bei pull_request relevant)"
    required: false
    default: ""
  pr-action:
    description: "github.event.action (opened|synchronize|reopened|edited|closed|ready_for_review); bei workflow_dispatch leer lassen"
    required: false
    default: ""
  pr-merged:
    description: "github.event.pull_request.merged als String 'true'/'false' (nur bei closed relevant)"
    required: false
    default: "false"
  pr-draft:
    description: "Optionaler Override für den Draft-Status ('true'/'false'). Leer = automatisch aus github.event.pull_request.draft"
    required: false
    default: ""
  skip-events:
    description: "Kommagetrennte Events, bei denen immer skip=true ausgegeben wird"
    required: false
    default: "push"
  main-branches:
    description: "Kommagetrennte Namen der Hauptbranches. Leer = 'main,master'"
    required: false
    default: "main,master"
  release-prefix:
    description: "Präfix der Release-Branches vor X.Y. Leer = 'release/'"
    required: false
    default: "release/"
  lts-prefix:
    description: "Präfix der Wartungsbranches vor X.Y. Leer = 'lts/'"
    required: false
    default: "lts/"

outputs:
  version:
    description: "Der berechnete Tag (leer, wenn skip=true)"
    value: ${{ steps.compute.outputs.tag }}
  skip:
    description: "'true', wenn kein Tag erzeugt werden soll"
    value: ${{ steps.compute.outputs.skip }}

runs:
  using: "composite"
  steps:
    - id: compute
      shell: bash
      env:
        GITHUB_EVENT_NAME: ${{ inputs.event-name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        PR_ACTION: ${{ inputs.pr-action }}
        PR_MERGED: ${{ inputs.pr-merged }}
        PR_DRAFT: ${{ inputs.pr-draft || github.event.pull_request.draft || 'false' }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        SKIP_EVENTS: ${{ inputs.skip-events }}
        MAIN_BRANCHES: ${{ inputs.main-branches }}
        RELEASE_PREFIX: ${{ inputs.release-prefix }}
        LTS_PREFIX: ${{ inputs.lts-prefix }}
      run: bash "${{ github.action_path }}/compute-container-tag.sh"
